<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Aravinth V — Mobile, Backend and Cloud Engineering</title>
  <desc id="desc">A Telestack-inspired portfolio banner for Aravinth V.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <circle cx="1020" cy="50" r="180" fill="#2563eb" opacity=".12"/>
  <circle cx="1120" cy="280" r="140" fill="#06b6d4" opacity=".08"/>
  <path d="M760 286c80-120 128-150 250-188" fill="none" stroke="#38bdf8" stroke-opacity=".22" stroke-width="2"/>
  <path d="M790 320c110-128 166-126 298-176" fill="none" stroke="#6366f1" stroke-opacity=".22" stroke-width="2"/>
  <g fill="#38bdf8" filter="url(#glow)">
    <circle cx="760" cy="286" r="5"/>
    <circle cx="1010" cy="98" r="5"/>
    <circle cx="790" cy="320" r="5"/>
    <circle cx="1088" cy="144" r="5"/>
  </g>
  <text x="72" y="106" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700">Aravinth V</text>
  <rect x="74" y="132" width="92" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="72" y="188" fill="#cbd5e1" font-family="Arial, Helvetica, sans-serif" font-size="25">Freelance Software Developer</text>
  <text x="72" y="230" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="20">Mobile products · Backend systems · Cloud infrastructure</text>
  <text x="72" y="286" fill="#38bdf8" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">BUILDING RELIABLE SOFTWARE FROM IDEA TO PRODUCTION</text>
</svg>
